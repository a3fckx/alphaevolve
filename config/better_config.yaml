# AlphaEvolve Configuration with proper evolution settings

evolution:
  population_size: 20      # Larger population for diversity
  generations: 10          # Fewer generations for testing
  elite_size: 3           # Keep only top 3 (15% of population)
  mutation_rate: 0.6      # 60% chance of mutation
  crossover_rate: 0.3     # 30% chance of crossover
  exploration_rate: 0.1   # 10% chance of exploration
  checkpoint_interval: 5  # Checkpoint every 5 generations

claude:
  model: "claude-sonnet-4-20250514"
  temperature: 0.7
  max_tokens: 8192

evaluation:
  timeout: 30  # seconds
  memory_limit_mb: 512

database:
  url: "sqlite:///data/alphaevolve.db"

logging:
  level: "INFO"
  file: "logs/alphaevolve.log"