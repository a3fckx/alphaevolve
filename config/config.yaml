# AlphaEvolve Configuration for Block-Based Evolution

# Number of block evolution iterations to run
iterations: 100

# How often to save a checkpoint (in iterations)
checkpoint_interval: 10

# Gemini API settings
gemini:
  model: "gemini-2.5-flash-lite-preview-06-17"
  temperature: 0.7
  max_tokens: 4096

# Evaluation settings
evaluation:
  timeout: 30 # seconds
  memory_limit_mb: 512 # MB

# Database settings
database:
  url: "sqlite:///data/alphaevolve.db"

# Logging settings
logging:
  level: "INFO"
  file: "logs/alphaevolve.log"
